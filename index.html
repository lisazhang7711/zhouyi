<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>读易 · 周易精读</title>
<style>
:root{
  --paper:#F6F3EC; --card:#FFFDF8; --ink:#26221E; --ink2:#6B6459; --ink3:#948B7C;
  --red:#9C3A2E; --blue:#2F4F6B; --line:#E5DFD2; --line2:#D6CEBD; --gold:#8A6D3B;
  /* 五行五色：低饱和，承接宣纸底色，不走俗艳的玄学配色 */
  --wx-wood:#4F7A63; --wx-fire:#9C3A2E; --wx-earth:#8A6D3B;
  --wx-metal:#6E7B84; --wx-water:#2F4F6B;
  /* 层次：侧栏比正文深一档，解决「正文与目录分不开」 */
  --side:#EAE3D4; --hover:#EFEADD; --sel:#F5EDE4; --onink:#FFFDF8;
  --shadow:rgba(38,34,30,.16);
}
body[data-theme=night]{
  --paper:#14120F; --card:#1E1B17; --ink:#E9E3D6; --ink2:#B3AA9A; --ink3:#8A8175;
  --red:#D97464; --blue:#8FB0CE; --line:#332E28; --line2:#463F37; --gold:#C9A460;
  --wx-wood:#79B492; --wx-fire:#D97464; --wx-earth:#C9A460;
  --wx-metal:#A6B2BB; --wx-water:#7FA6C7;
  --side:#0D0B09; --hover:#241F1A; --sel:#2B2520; --onink:#14120F;
  --shadow:rgba(0,0,0,.55);
}
body{transition:background .18s,color .18s}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  font-size:15px; line-height:1.85;
}
header{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap;
}
.logo{font-size:18px;font-weight:600;letter-spacing:2px}
.logo small{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-left:8px;font-weight:400}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{
  background:transparent;border:0;padding:5px 11px;font-family:inherit;font-size:13px;
  color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2);white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--ink);color:var(--onink)}
input[type=search]{
  border:1px solid var(--line2);border-radius:6px;background:var(--card);
  padding:6px 10px;font-family:inherit;font-size:13px;width:180px;color:var(--ink);
}
input[type=search]:focus{outline:1px solid var(--blue)}
.wrap{display:flex;align-items:flex-start;gap:0;max-width:1640px;margin:0 auto}
aside{
  width:250px;flex:0 0 250px;height:calc(100vh - 54px);overflow-y:auto;
  border-right:1px solid var(--line2);padding:0 0 40px;position:sticky;top:54px;
  background:var(--side);
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
/* 目录收缩：收起后 aside 让位，露出一条可点击展开的窄轨 */
.siderail{
  display:none;width:34px;flex:0 0 34px;height:calc(100vh - 54px);position:sticky;top:54px;
  border:0;border-right:1px solid var(--line2);background:var(--side);cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink3);letter-spacing:3px;padding:14px 0;
  writing-mode:vertical-rl;
}
.siderail:hover{color:var(--blue);background:var(--hover)}
body.sidecollapse .siderail{display:block}
body.sidecollapse aside{display:none}
body.sideoff .siderail{display:none}
.sidetop{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--side);z-index:2}
.sidetop .seg{flex:1;min-width:0}
.sidetop .seg button{flex:1;text-align:center;padding:5px 0}
.minbtn{
  flex:0 0 auto;border:1px solid var(--line2);background:transparent;border-radius:4px;
  font-family:inherit;font-size:12px;line-height:1;color:var(--ink3);cursor:pointer;padding:5px 7px;
}
.minbtn:hover{border-color:var(--blue);color:var(--blue)}
.gitem{display:flex;align-items:center;gap:9px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;font-size:14px}
.gitem:hover{background:var(--hover)}
.gitem.on{background:var(--sel);border-left-color:var(--red)}
.gnum{font-size:11px;color:var(--ink3);width:20px;text-align:right;flex:0 0 20px}
.gitem.on .gname{color:var(--red);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:12px 14px}
.gcell{border:1px solid var(--line);border-radius:5px;background:var(--card);padding:6px 2px 4px;cursor:pointer;text-align:center}
.gcell:hover{border-color:var(--red);background:var(--hover)}
.gcell.on{border-color:var(--red);background:var(--sel)}
.gcell .nm{font-size:12px;margin-top:3px;line-height:1.2}
.tagsec{padding:4px 14px 12px}
.tagsec h4{font-size:12px;color:var(--ink3);font-weight:400;padding:10px 0 6px}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:12px;padding:2px 10px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
main{flex:1 1 auto;min-width:0;padding:22px 30px 90px;max-width:920px;margin:0 auto}

.tu{display:flex;flex-direction:column;gap:5px}
.tu .y{height:13px;display:flex;justify-content:space-between}
.tu .y i{background:var(--ink);height:100%;border-radius:1px}
.tu .y.yang i{width:100%}
.tu .y.yin i{width:42%}
.tu.sm{width:20px}.tu.sm .y{height:3px;gap:0}.tu.sm .y i{background:var(--ink2)}
.tu.mid{width:34px}.tu.mid .y{height:6px}
.tu.big{width:76px}.tu.big .y{height:15px}
.tu .y.mv i{background:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.tu.click .y{cursor:pointer}
.tu.click .y:hover i{background:var(--gold)}

.ghead{display:flex;align-items:center;gap:22px;margin-bottom:14px;flex-wrap:wrap}
.gtitle h1{font-size:30px;font-weight:600;letter-spacing:4px;margin-bottom:2px}
.gtitle .meta{font-size:12px;color:var(--ink3);letter-spacing:1px}
.gtitle .full{margin-top:2px}
.wx{font-weight:600;padding:0 2px}
.wx-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.mvbar{font-size:12px;color:var(--ink3);margin-top:6px}

/* 收藏：星标只用金色的「有/无」两态，不引入第二套语义 */
/* 权重写成 button.star，压过后面 .cbtns button::before 的 ⧉ */
.cbtns button.star{margin-left:3px}
.cbtns button.star::before{content:"☆";font-size:13px;color:var(--line2)}
.cbtns button.star:hover{border-color:var(--gold);color:var(--gold)}
.cbtns button.star:hover::before{color:var(--gold)}
.cbtns button.star.on{border-color:var(--gold);color:var(--gold)}
.cbtns button.star.on::before{content:"★";color:var(--gold)}
/* 卦序列表：只标「本卦有 N 条收藏」，不给整卦加星——收藏单位是句子 */
.gitem .fc{margin-left:auto;font-size:11px;color:var(--gold);flex:0 0 auto;letter-spacing:0}
.fitem{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.fitem:hover{background:var(--hover)}
.fitem .fh{display:flex;align-items:center;gap:6px}
.fitem .fp{font-size:12px;color:var(--gold);letter-spacing:1px}
.fitem .fav{margin-left:auto;font-size:13px;color:var(--gold);flex:0 0 auto}
.fitem .ft{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favempty{padding:16px 14px;color:var(--ink3);font-size:13px;line-height:1.9}

/* 进度：序号徽标 + 进度条，数字用等宽避免跳动 */
.snum{
  display:inline-flex;align-items:center;justify-content:center;min-width:36px;
  font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:10px;
  padding:0 7px;line-height:1.7;cursor:pointer;flex:0 0 auto;
  font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.snum:hover{border-color:var(--gold);color:var(--gold)}
.snum.done{border-color:var(--wx-wood);color:var(--wx-wood);background:var(--sel)}
.snum.now{border-color:var(--red);color:var(--red);background:var(--sel);font-weight:600}
/* 进度条：本卦 / 全书两行同一套三列网格，列宽固定，数字等宽右对齐 */
.prog{display:grid;grid-template-columns:40px 1fr 132px;align-items:center;gap:12px;
  font-size:12px;color:var(--ink2);width:100%;max-width:560px}
.prog .pt{letter-spacing:1px}
.prog .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .22s}
.prog .pv{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prog .pv b{color:var(--ink);font-weight:600}
.prog .pv.zero{color:var(--ink3)}
.progbox{display:flex;flex-direction:column;gap:8px;background:var(--side);
  border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;
  position:relative}
.progbox .clr{align-self:flex-start;margin-top:2px}
.progbox .pt{font-size:12px;color:var(--ink3);letter-spacing:1px;flex:0 0 auto}
.flowbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--side);
  border:1px solid var(--gold);border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--ink2)}
.flowbar .fname{color:var(--gold);font-weight:600;letter-spacing:1px}
.flowbar .fpos{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.flowbar button,.progbox button{
  border:1px solid var(--line2);background:transparent;border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--ink2);cursor:pointer;padding:3px 10px;
}
.flowbar button:hover,.progbox button:hover{border-color:var(--gold);color:var(--gold)}
.flowbar button:disabled{opacity:.45;cursor:default;border-color:var(--line2);color:var(--ink3)}
.card.now,.ycard.now{border-color:var(--red);box-shadow:0 0 0 2px var(--sel)}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:14px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding-bottom:6px;margin-bottom:10px}
.chead h3{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:2px}
.cbtns{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.cplab{font-size:11px;color:var(--ink3);letter-spacing:1px}
.cbtns button{
  border:1px solid var(--line2);background:transparent;border-radius:4px;
  font-family:inherit;font-size:11px;color:var(--ink2);cursor:pointer;
  padding:1px 8px 1px 6px;line-height:1.8;display:inline-flex;align-items:center;gap:4px;
}
.cbtns button::before{content:"⧉";font-size:12px;color:var(--ink3)}
.cbtns button:hover{border-color:var(--blue);color:var(--blue);background:var(--hover)}
.cbtns button:hover::before{color:var(--blue)}
.cbtns button.done{border-color:var(--red);color:var(--red)}
.cbtns button.done::before{content:"✓";color:var(--red)}
.yuan{font-size:17px;line-height:2.05;letter-spacing:.5px}
.bai{font-size:14px;color:var(--ink2);line-height:1.95;margin-top:10px}
.bai::before{content:"今譯 ";color:var(--ink3);font-size:11px;letter-spacing:1px}
.xiao{font-size:13px;color:var(--ink2);margin-top:8px;padding-left:12px;border-left:2px solid var(--line2)}
.xiao::before{content:"象傳 ";color:var(--ink3);font-size:11px}

.ycard{cursor:default;margin-bottom:10px}
.ycard:hover{border-color:var(--line2)}
.ycard.mv{border-color:var(--red);background:var(--sel)}
.ycard .chead h3{font-size:13px;color:var(--red);letter-spacing:1px;border:1px solid var(--red);border-radius:4px;padding:0 8px;line-height:1.55}
.zi{margin-top:9px;padding-top:8px;border-top:1px dotted var(--line2);display:flex;flex-direction:column;gap:5px}
.zi .z{font-size:13px;color:var(--ink2);line-height:1.8}
.zi .z b{font-weight:600;font-size:12px;margin-right:6px;border:1px solid;border-radius:3px;padding:0 5px}
.zi .z.t-earth b{color:var(--wx-earth);border-color:var(--wx-earth)}
.zi .z.t-water b{color:var(--wx-water);border-color:var(--wx-water)}
.zi .z.t-fire  b{color:var(--wx-fire);border-color:var(--wx-fire)}
.zi .z.t-wood  b{color:var(--wx-wood);border-color:var(--wx-wood)}
.zi .z.t-metal b{color:var(--wx-metal);border-color:var(--wx-metal)}

.kw{border-bottom:1px dotted var(--ink3);cursor:help;border-radius:2px;transition:background .12s}
.kw:hover{background:var(--hover)}
.kw.on{background:var(--sel);border-bottom-color:var(--red)}
#tip{
  position:fixed;z-index:60;max-width:290px;background:var(--card);border:1px solid var(--line2);
  border-radius:7px;padding:10px 13px;box-shadow:0 6px 20px var(--shadow);
  font-size:13px;line-height:1.75;color:var(--ink2);display:none;
}
#tip .tk{font-size:15px;color:var(--ink);font-weight:600;margin-right:8px}
#tip .tt{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-bottom:4px}

.tui{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.tuifoot{font-size:11.5px;color:var(--ink3);line-height:1.85;margin-bottom:12px}
.tuifoot b{color:var(--ink2);font-weight:600}
.tcard .tt{position:relative}
.tcard .tal{display:block;font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:0;margin-top:2px}
.xsbox{border:1px solid var(--line2);border-radius:8px;background:var(--side);margin-bottom:14px}
.xsbox>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.xsbox>summary::-webkit-details-marker{display:none}
.xsbox>summary::before{content:"▸ ";color:var(--ink3)}
.xsbox[open]>summary::before{content:"▾ ";color:var(--ink3)}
.xsbox>summary .xstag{margin-left:8px;font-size:11px;font-weight:400;color:var(--ink3);
  border:1px solid var(--line2);border-radius:3px;padding:1px 6px}
.xsbd{padding:0 14px 12px}
.xsh{font-size:11.5px;letter-spacing:1px;color:var(--ink3);margin:10px 0 5px;
  border-bottom:1px dotted var(--line2);padding-bottom:4px}
.xsrow{display:flex;gap:10px;font-size:12.5px;line-height:1.85;padding:2px 0}
.xsrow b{flex:0 0 62px;color:var(--ink);font-weight:600}
.xsrow span{color:var(--ink2);min-width:0}
.xsrow i{display:block;font-style:normal;color:var(--ink3);font-size:11.5px}
.xst{width:100%;border-collapse:collapse;font-size:12px;margin-top:2px}
.xst th,.xst td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.xst th{background:var(--sel);color:var(--ink3);font-weight:600;font-size:11.5px}
.xst td{color:var(--ink2)}
.xsfoot{font-size:11.5px;color:var(--ink3);line-height:1.9;margin-top:10px;
  border-top:1px dotted var(--line2);padding-top:8px}
/* ---- 史層：統一的卡片模板，三類內容只在徽標上分家 ---- */
.shcls-d{font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:0}
.shblk{border:1px solid var(--line);border-radius:6px;background:var(--card);
  padding:9px 12px;margin:7px 0 11px}
.shqt{font-size:15px;color:var(--ink);line-height:1.85;padding-bottom:6px;
  border-bottom:1px dotted var(--line2);margin-bottom:6px}
.shsrc{margin-top:7px}
.shsrc1{display:flex;gap:8px;padding:6px 0;border-top:1px dotted var(--line2)}
.shsrc-b{flex:0 0 32px;height:19px;line-height:19px;text-align:center;font-size:11px;
  border-radius:3px;font-weight:600;letter-spacing:1px}
.shsrc-b.k-jing {color:var(--red);  background:color-mix(in srgb, var(--red) 10%, transparent)}
.shsrc-b.k-chuan{color:var(--blue); background:color-mix(in srgb, var(--blue) 10%, transparent)}
.shsrc-b.k-chu  {color:var(--wx-earth);background:color-mix(in srgb, var(--wx-earth) 14%, transparent)}
.shsrc-t{flex:1;min-width:0;font-size:13px}
.shsrc-t b{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:2px}
.shsrc-t .yuan{font-size:13.5px;line-height:1.8;color:var(--ink)}
.shsrc-t .bai{font-size:12.5px;line-height:1.75;color:var(--ink2)}
.shcf{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;
  margin-right:6px;font-weight:600;vertical-align:1px}
.shcf.k-high{color:var(--wx-wood);background:color-mix(in srgb, var(--wx-wood) 12%, transparent)}
.shcf.k-mid {color:var(--wx-earth);background:color-mix(in srgb, var(--wx-earth) 14%, transparent)}
.shcf.k-low {color:var(--red);background:color-mix(in srgb, var(--red) 10%, transparent)}
.shtxt{color:var(--ink2)}
/* 側欄「史」：按時代分段的時間軸 */
.shtl{padding:4px 2px 20px}
.shtl-h{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:1px}
.shtl-n{font-size:11.5px;color:var(--ink3);margin:2px 0 10px}
.shera{margin-bottom:14px;border-left:2px solid var(--line2);padding-left:10px}
.shera-t{display:flex;align-items:baseline;gap:8px}
.shera-t b{font-size:12.5px;color:var(--ink)}
.shera-t span{font-size:11px;color:var(--ink3)}
.shera-n{font-size:11.5px;color:var(--ink3);line-height:1.8;margin-bottom:6px}
.shiitem{border:1px solid var(--line);border-radius:6px;background:var(--card);
  padding:7px 9px;margin-bottom:6px;cursor:pointer}
.shiitem:hover{border-color:var(--blue)}
.shiitem.on{border-color:var(--blue);background:var(--sel)}
.shii-h{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.shcls{font-size:11px;font-weight:600;padding:0 6px;border-radius:3px;letter-spacing:1px;
  color:var(--blue);background:color-mix(in srgb, var(--blue) 10%, transparent)}
.shcls.k-jing{color:var(--red);background:color-mix(in srgb, var(--red) 10%, transparent)}
.shcls.k-yong{color:var(--wx-wood);background:color-mix(in srgb, var(--wx-wood) 12%, transparent)}
.shii-g{font-size:13px;font-weight:600;color:var(--ink)}
.shii-t{font-size:13px;color:var(--ink2);line-height:1.7}
.shii-d{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:2px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;cursor:pointer}
.tcard:hover{border-color:var(--blue)}
.tcard .tt{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-bottom:8px}
.tcard .tu{margin:0 auto 7px}
.tcard .tn{font-size:14px;font-weight:600}
.tcard .td{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:3px}
.pend{color:var(--ink3);font-size:13px;padding:8px 0;border-top:1px dotted var(--line2);margin-top:10px}
.guanlian{font-size:13px;color:var(--ink2);line-height:1.9}
.guanlian b{color:var(--gold)}
.note{font-size:12px;color:var(--ink3);line-height:1.8;padding:10px 0;border-top:1px solid var(--line2);margin-top:20px}
/* 义理层：〔傳〕〔解〕〔用〕〔資〕 四层开关与面板 */
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.lchip{
  font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px 9px;
  color:var(--ink3);cursor:pointer;white-space:nowrap;
}
.lchip:hover{border-color:var(--gold);color:var(--gold)}
.lchip.on{background:var(--sel);border-color:var(--gold);color:var(--gold);font-weight:600}
.school{font-size:13px;line-height:1.9;color:var(--ink2);padding:7px 0;border-top:1px dotted var(--line2)}
.school b{color:var(--gold);margin-right:8px;font-weight:600}

<script>
/* 八卦取象（说卦传节要，公有领域） */
const XIANG_TRI = {
  '乾':'乾為天、為圜、為君、為父、為玉、為金、為寒、為冰、為大赤、為良馬、為木果。',
  '坤':'坤為地、為母、為布、為釜、為吝嗇、為均、為子母牛、為大輿、為文、為眾、為柄。',
  '震':'震為雷、為龍、為玄黃、為旉、為大塗、為長子、為決躁、為蒼筤竹、為萑葦。',
  '巽':'巽為木、為風、為長女、為繩直、為工、為白、為長、為高、為進退、為不果、為臭。',
  '坎':'坎為水、為溝瀆、為隱伏、為矯輮、為弓輪、為血卦、為赤、為心病、為耳痛。',
  '離':'離為火、為日、為電、為中女、為甲冑、為戈兵、為大腹、為乾卦、為鱉、為蟹、為蚌、為龜。',
  '艮':'艮為山、為徑路、為小石、為門闕、為果蓏、為閽寺、為指、為狗、為鼠。',
  '兌':'兌為澤、為少女、為巫、為口舌、為毀折、為附決、為剛鹵、為妾、為羊。'
};

/* 八卦五行：给卦象线条与卦名做信息编码，不是装饰 */
const WUXING = {'乾':'金','兌':'金','離':'火','震':'木','巽':'木','坎':'水','艮':'土','坤':'土'};
const WX_VAR = {'木':'--wx-wood','火':'--wx-fire','土':'--wx-earth','金':'--wx-metal','水':'--wx-water'};
function wxColor(e){ return 'var(' + (WX_VAR[e] || '--wx-metal') + ')'; }

/* 注释四类 → 五行色（字形切换后仍要命中，故用映射而非中文类名） */
const ZTONE = {
  '字義':'earth','象數':'water','義理':'fire','筮例':'wood','史':'metal',
  '字义':'earth','象数':'water','义理':'fire','筮例':'wood'
};

const G = GUA.map(function(a){
  return {n:a[0],name:a[1],full:a[2],down:a[3],up:a[4],
          ci:a[5],ciM:a[6],xiang:a[7],xiangM:a[8],tags:a[9].split(',')};
});
function linesOf(g){ return TRIGRAM[g.down] + TRIGRAM[g.up]; }
const BY_LINES = {};
G.forEach(function(g){ BY_LINES[linesOf(g)] = g; });
function guaByLines(l){ return BY_LINES[l] || null; }

let cur = 1, mode = 'both', view = 'list', moving = [false,false,false,false,false,false];
let filterTag = null, ziOn = true, xsOpen = false, shiOpen = false, theme = 'day';
try {
  const s = localStorage.getItem('zy.script'); if (s) SCRIPT = s;
  const z = localStorage.getItem('zy.zi');     if (z !== null) ziOn = z === '1';
  const th = localStorage.getItem('zy.theme'); if (th) theme = th;
} catch(e){}
function applyTheme(){
  document.body.setAttribute('data-theme', theme);
  document.querySelectorAll('#themeSeg button').forEach(function(b){
    b.classList.toggle('on', b.dataset.t === theme);
  });
}

/* ---------------- 收藏 ----------------
   收藏单位是「句子」不是「卦」：key = 卦号 + ':' + ci|xiang|y0..y5
   每条卦辞、大象传、每一爻各自独立收藏 */
let fav = [];
try {
  const f = localStorage.getItem('zy.fav');
  if (f) fav = JSON.parse(f).map(function(x){
    /* 兼容早期「整卦收藏」的旧数据：卦号 → 该卦卦辞 */
    return typeof x === 'number' ? x + ':ci' : x;
  }).filter(function(x){ return typeof x === 'string'; });
} catch(e){}
function saveFav(){ try { localStorage.setItem('zy.fav', JSON.stringify(fav)); } catch(e){} }
function isFav(k){ return fav.indexOf(k) >= 0; }
function toggleFav(k){
  const i = fav.indexOf(k);
  if (i >= 0) fav.splice(i, 1); else fav.push(k);
  saveFav(); renderSide(); renderMain();
}
function favCount(){ return fav.length; }
function favOfGua(n){ return fav.filter(function(k){ return k.split(':')[0] === String(n); }).length; }

/* ---------------- 进度 ----------------
   句子 = 卦辞 / 大象传 / 每一爻，各自计一句。
   两层进度：① 卦内 i/N  ② 主题流 i/N（按标签把句子串成一条阅读流） */
let read = new Set();
try {
  const r = localStorage.getItem('zy.read');
  if (r) JSON.parse(r).forEach(function(k){ if (typeof k === 'string') read.add(k); });
} catch(e){}
function saveRead(){ try { localStorage.setItem('zy.read', JSON.stringify([...read])); } catch(e){} }
function isRead(k){ return read.has(k); }
function toggleRead(k){
  if (read.has(k)) read.delete(k); else read.add(k);
  saveRead(); renderSide(); renderMain();
}
let curPos = null;
try { curPos = localStorage.getItem('zy.pos'); } catch(e){}
function setPos(k){ curPos = k; try { localStorage.setItem('zy.pos', k); } catch(e){} }

let flowTag = null, flowIdx = 0, pendingScroll = false;

/* 一卦的全部句子 */
function sentencesOf(g){
  const out = [];
  out.push({k:g.n + ':ci',    label:HM('卦辞'),   y:HJ(g.ci),    m:HM(g.ciM)});
  out.push({k:g.n + ':xiang', label:HM('大象传'), y:HJ(g.xiang), m:HM(g.xiangM)});

    out.push({k:g.n + ':y' + i, label:HJ(y.t), y:HJ(y.c), m:HM(y.m)});

function totalSentences(){

/* 某个主题（标签）下的句子流 */
function flowOf(tag){
  const out = [];
  G.forEach(function(g){
    if (g.tags.indexOf(tag) < 0) return;
    sentencesOf(g).forEach(function(s){ out.push(Object.assign({g:g, n:g.n}, s)); });
  });
  return out;
}
function readTotal(){ return [...read].filter(function(k){ return !!parseKey(k); }).length; }
function parseKey(k){
  if (typeof k !== 'string') return null;
  const p = k.split(':'), n = +p[0], g = gua(n);
  if (!g) return null;
  const pp = p[1];
  if (pp === 'ci' || pp === 'xiang' || pp === 'xu' || pp === 'za') return {n:n, g:g};
  if (/^wy\d+$/.test(pp)) return {n:n, g:g};
  const m = /^y(\d+)$/.exec(pp);
  if (m && YAO[n] && YAO[n][+m[1]]) return {n:n, g:g};
  return null;
}

    ? '<b>' + pct + '%</b> ' + HM('已读') + ' ' + done + ' / ' + total
    : '<span class="zero">' + HM('未开始') + '</span>';
  return '<span class="prog"><span class="pt">' + label + '</span>'
    + '<span class="bar"><i style="width:' + pct + '%"></i></span>'
    + '<span class="pv' + (done ? '' : ' zero') + '">' + pv + '</span></span>';

function favItem(k){
  const p = k.split(':'), n = +p[0], g = gua(n);
  if (!g) return null;
  if (p[1] === 'ci')    return {k:k, n:n, part:HM('卦辞'),   text:HJ(g.ci),    bai:HM(g.ciM)};
  if (p[1] === 'xiang') return {k:k, n:n, part:HM('大象传'), text:HJ(g.xiang), bai:HM(g.xiangM)};
  if (p[1] === 'xu') { const a = XUGUA[n]; return a ? {k:k, n:n, part:HM('序卦传'), text:HJ(a[0]), bai:HM(a[1])} : null; }
  if (p[1] === 'za') { const b = ZAGUA[n]; return b ? {k:k, n:n, part:HM('杂卦传'), text:HJ(b[0]), bai:HM(b[1])} : null; }
  const wm = /^wy(\d+)$/.exec(p[1]);
  if (wm) { const c = WENYAN[n] && WENYAN[n][+wm[1]]; return c ? {k:k, n:n, part:HM('文言'), text:HJ(c[0]), bai:HM(c[1])} : null; }
  const i = +String(p[1]).slice(1), y = YAO[n] && YAO[n][i];

/* ---------------- 复制 ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}
function put(s){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).catch(function(){ fallback(s); });
  } else fallback(s);
}
function fallback(s){
  const ta = document.createElement('textarea');
  ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ---------------- 句内折叠框 〔解〕〔用〕〔資〕 ---------------- */
let subs = new Set();
try { const sb = localStorage.getItem('zy.subs'); if (sb) subs = new Set(JSON.parse(sb)); } catch(e){}
function saveSubs(){ try { localStorage.setItem('zy.subs', JSON.stringify([...subs])); } catch(e){} }
/* 〔史〕只在該句確有史事時出現：六十四卦中有史可考者不過十餘卦，
   若每句都掛一個史框，史層就成了噪音。 */
function subDefs(kind, g, i){
  if (kind === 'chuan') return [['jie','解','历代解说'], ['zi','資','他书互见']];
  const d = [['jie','解','历代解说'], ['yong','用','处境卡'], ['xs','象','象数体例']];
  if (g && shiHas(g.n, kind, +i)) d.push(['shi','史','史事互证']);
  d.push(['zi','資','他书互见']);
  return d;
}
function subKeysOf(g){
  const out = [['ci',0],['xiang',0]];
  (YAO[g.n] || []).forEach(function(_, i){ out.push(['yao', i]); });
  if (XUGUA[g.n])   out.push(['chuan','xu']);
  if (ZAGUA[g.n])   out.push(['chuan','za']);
  (WENYAN[g.n] || []).forEach(function(_, j){ out.push(['chuan','wy' + j]); });
  return out;
}
function subAll(open){
  const g = gua(cur);
  subKeysOf(g).forEach(function(p){
    subDefs(p[0], g, p[1]).forEach(function(d){
      const k = g.n + ':' + p[0] + ':' + p[1] + ':' + d[0];
      if (open) subs.add(k); else subs.delete(k);
    });
  });
  saveSubs(); renderMain();
}
function subBlockHTML(g, kind, i){
  const defs = subDefs(kind, g, i);
  let h = '<div class="subbar">' + defs.map(function(d){
    const k = g.n + ':' + kind + ':' + i + ':' + d[0];
    return '<button class="sb' + (subs.has(k) ? ' on' : '') + '" data-sub="' + k + '">'
         + HJ('〔') + HJ(d[1]) + HJ('〕') + HM(d[2]) + '</button>';
  }).join('') + '</div>';
  defs.forEach(function(d){
    if (!subs.has(g.n + ':' + kind + ':' + i + ':' + d[0])) return;
    h += '<div class="subbox">' + subBoxBody(g, d[0], kind, i) + '</div>';
  });
  return h;
}
function subRows(R){
  return R.rows.map(function(r){
    return '<div class="srow"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'; }).join('');
}
function subBoxBody(g, which, kind, i){
  if (which === 'jie') {
    const R = subJie(g, kind, i);
    return '<h5>' + HJ('〔解〕') + HM('历代解说')
      + '<span class="gentag">' + HM(R.gen ? '依卦德推演' : '本卦专撰') + '</span></h5>'
      + subRows(R)
      + '<div class="subdis">' + HM('以上由本项目依历代易学方法自行撰述，是概述而非某一家原注的照录。') + '</div>';
  }
  if (which === 'yong') {
    const R = subYong(g, kind, i);
    return '<h5>' + HJ('〔用〕') + HM('处境卡')
      + '<span class="gentag">' + HM(R.gen ? '依卦德推演' : '本卦专撰') + '</span></h5>'
      + subRows(R)
      + '<div class="subdis">' + HM('处境卡是把卦象读成一种处境模型，属义理引申，既非经文原意，也不用于预测。') + '</div>';
  }
  if (which === 'xs') {
    const R = kind === 'yao' ? xsSubYao(g, i) : (kind === 'xiang' ? xsSubXiang(g) : xsSubCi(g));
    return '<h5>' + HJ('〔象〕') + HM('象数体例')
      + '<span class="gentag">' + HM(kind === 'yao' ? '依爻位推算' : '依卦体推算') + '</span></h5>'
      + subRows(R)
      + '<div class="subdis">' + HM('当位、得中、应、承乘据皆汉易爻位通例：阳居初三五、阴居二四上为当位；二五为中位；'
        + '初四、二五、三上阴阳相异为有应。此例用于读卦爻结构，不用于占验。') + '</div>';
  }
  if (which === 'shi') {
    const R = shiSub(g, kind, i), c = shiSent(g.n, kind, i).length;
    return '<h5>' + HJ('〔史〕') + HM('史事互证')
      + '<span class="gentag">' + c + ' ' + HM('条') + '</span></h5>'
      + subRows(R) + R.src
      + '<div class="subdis">' + HM('以史证易，是近人顾颉刚《周易卦爻辞中的故事》（1929）所开的方法：把卦爻辞当史料读。'
        + '但卦爻辞本是筮辞，可考者考之，不可考者存疑——凡标「推拟未定」者都只是旧说，不是定论。') + '</div>';
  }
  const items = subZi(g, kind === 'yao');
  let s = '<h5>' + HJ('〔資〕') + HM('他书互见')
    + '<span class="gentag">' + items.length + ' ' + HM('条') + '</span></h5>';
  items.forEach(function(x){
    s += '<div class="hj"><span class="hjsrc">' + HJ(x.src) + '</span>'
      + '<div class="yuan">' + annotate(x.t) + '</div>'
      + '<div class="bai">' + HM(x.m) + '</div>'
      + '<div class="hjlink">' + (x.gua.length
          ? x.gua.map(function(n){ return '<span class="chip" data-n="' + n + '">' + HJ(gua(n).name) + '</span>'; }).join('')
          : '<span class="hjall">' + HM('通论 · 不专属某一卦') + '</span>')
      + '</div></div>';
  });
  if (kind === 'yao')
    s += '<div class="subdis">' + HM('爻下只列通论条目；本卦专属的互见条目见卦辞一栏。') + '</div>';
  s += '<div class="subdis">' + HM('引文为公有领域古籍原文，今译由本项目自研。') + '</div>';
  return s;
}

    + '<span class="u"><b>' + HJ('〔解〕〔用〕〔資〕') + '</b> ' + HM('= 每句下方三个可展开的框：历代解说 / 处境卡 / 他书互见，点开即在原句下面成框。') + '</span>'

  bindKw(m);

/* ---------------- 字词弹层 ---------------- */
function bindKw(root){
  const tip = document.getElementById('tip');
  root.querySelectorAll('.kw').forEach(function(k){
    k.onclick = function(e){
      e.stopPropagation();
      const key = k.dataset.k, def = GLOSS_MAP[key];
      if (!def) return;
      const was = k.classList.contains('on');
      root.querySelectorAll('.kw.on').forEach(function(x){ x.classList.remove('on'); });
      if (was) { tip.style.display = 'none'; return; }
      k.classList.add('on');
      tip.innerHTML = '<div class="tt">' + HM('字词') + '</div><span class="tk">'
                    + esc(key) + '</span>' + esc(def);
      tip.style.display = 'block';
      const r = k.getBoundingClientRect();
      let left = r.left, top = r.bottom + 8;
      if (left + 300 > window.innerWidth) left = window.innerWidth - 306;
      if (top + tip.offsetHeight > window.innerHeight - 10) top = r.top - tip.offsetHeight - 8;
      tip.style.left = Math.max(8, left) + 'px';
      tip.style.top = Math.max(8, top) + 'px';
    };
  });
}
document.addEventListener('click', function(e){
  if (!e.target.closest('.kw') && !e.target.closest('#tip')) {
    document.getElementById('tip').style.display = 'none';
    document.querySelectorAll('.kw.on').forEach(function(x){ x.classList.remove('on'); });
  }
});

/* ---------------- 顶栏与初始化 ---------------- */
const MODE_LABEL = {'both':'文白对照','yuan':'仅原文','bai':'仅今译'};
function applyScriptUI(){
  document.querySelectorAll('#scriptSeg button').forEach(function(b){
    b.classList.toggle('on', b.dataset.s === SCRIPT);
  });
  document.querySelectorAll('#ziSeg button').forEach(function(b){
    b.classList.toggle('on', (b.dataset.z === '1') === ziOn);
  });
  document.querySelectorAll('#modeSeg button').forEach(function(b){
    b.textContent = HM(MODE_LABEL[b.dataset.m]);
  });
  document.title = HM('读易 · 周易精读');
  document.getElementById('sub').textContent = HM('周易精读');
  document.getElementById('q').placeholder = HM('搜索卦名 / 卦辞 / 标签');
}
/* 〔境〕定位到建议首读的那一爻并短暂高亮 */
function jumpYao(yt){
  if (!yt) return;
  setTimeout(function(){
    var t = document.querySelector('#main .ycard[data-yt="' + yt + '"]');
    if (!t) return;
    t.classList.add('hit');
    t.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function(){ t.classList.remove('hit'); }, 2600);
  }, 80);
}
function renderAll(){ renderSide(); renderMain(); }

document.getElementById('scriptSeg').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  SCRIPT = b.dataset.s;
  try { localStorage.setItem('zy.script', SCRIPT); } catch(err){}
  buildGloss(); applyScriptUI(); renderAll();
};
document.getElementById('ziSeg').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  ziOn = b.dataset.z === '1';
  try { localStorage.setItem('zy.zi', ziOn ? '1' : '0'); } catch(err){}
  applyScriptUI(); renderMain();
};
document.getElementById('modeSeg').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m;
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  renderMain();
};
document.getElementById('themeSeg').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.t;
  try { localStorage.setItem('zy.theme', theme); } catch(err){}
  applyTheme();
};
document.getElementById('q').oninput = function(){
  const k = this.value.trim();
  const el = document.getElementById('side');
  if (!k) { renderSide(); return; }
  const hit = G.filter(function(g){
    return [g.name, g.full, String(g.n), g.ci, g.tags.join(',')].some(function(s){
      return s.indexOf(k) >= 0 || HJ(s).indexOf(k) >= 0;
    });
  });
  let body = hit.map(gitemHTML).join('');
  el.innerHTML = sideTopHTML('')
    + (body || '<div class="favempty">' + HM('未找到') + '</div>');
  bindSideMin(el);
  el.querySelectorAll('.gitem').forEach(function(c){
    c.onclick = function(){ cur = +c.dataset.n; resetMv(); renderAll(); };
  });
};


/* ---------------- 右侧小助手 ---------------- */
let aiHist = [];
/* 助手默认常驻，aioff 才是「隐藏」 */
function aiToggle(open){
  const on = open === undefined ? document.body.classList.contains('aioff') : open;
  document.body.classList.toggle('aioff', !on);
  document.body.classList.toggle('aiforce', !!on);   /* 窄屏下唤出为浮层 */
  try { localStorage.setItem('zy.aion', on ? '1' : '0'); } catch(e){}
  syncTog();
  if (on && !aiHist.length) aiWelcome();
  if (on) { const q = document.getElementById('aiq'); if (q) q.focus(); }
}
function sideToggle(open){
  const on = open === undefined ? document.body.classList.contains('sideoff') : open;
  document.body.classList.toggle('sideoff', !on);
  try { localStorage.setItem('zy.sideon', on ? '1' : '0'); } catch(e){}
  syncTog();
}
/* 目录收缩：aside 让位，露出竖排窄轨；点窄轨再展开 */
function sideCollapse(collapsed){
  const c = collapsed === undefined ? !document.body.classList.contains('sidecollapse') : collapsed;
  document.body.classList.toggle('sidecollapse', c);
  try { localStorage.setItem('zy.sidecol', c ? '1' : '0'); } catch(e){}
}
function bindSideMin(el){
  el.querySelectorAll('.minbtn').forEach(function(b){
    b.onclick = function(){ sideCollapse(true); };
  });
}
function syncTog(){
  const st = document.getElementById('sideTog'), at = document.getElementById('aiTog');
  if (st) st.classList.toggle('on', !document.body.classList.contains('sideoff'));
  if (at) at.classList.toggle('on', !document.body.classList.contains('aioff'));
}
function aiCfgUI(){
  const c = aiCfg() || {endpoint:'', key:'', model:''};
  const e = document.getElementById('aiEp'), k = document.getElementById('aiKey'), m = document.getElementById('aiModel');
  if (e) e.value = c.endpoint || '';
  if (k) k.value = c.key || '';
  if (m) m.value = c.model || '';
  const st = document.getElementById('aistat');
  if (st) st.textContent = HM(c.endpoint ? '远程模型 · ' + (c.model || '') : '离线 · 读本站数据');
}
function aiSaveCfg(ep, key, model){
  try { localStorage.setItem('zy.ai', JSON.stringify({endpoint:ep||'', key:key||'', model:model||''})); } catch(e){}
  aiCfgUI();
  toast(HM(ep ? '已接上远程模型' : '已切回离线引擎'));
}
function msgHTML(x){
  if (x.role === 'q') return '<div class="msg q"><span class="mq">' + esc(x.text) + '</span></div>';
  const a = x.a;
  let h = '<div class="msg"><div class="mtitle">' + a.title + '</div>';
  a.blocks.forEach(function(b){
    if (b.k === 'p')    h += '<div class="mp">' + b.v + '</div>';
    else if (b.k === 'list') h += '<ul class="mul">' + b.v.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul>';
    else if (b.k === 'kv')   h += '<div class="mkv">' + b.v.map(function(p){
      return '<div><b>' + p[0] + '</b><span>' + p[1] + '</span></div>'; }).join('') + '</div>';
    else if (b.k === 'q')    h += '<div class="mquote">' + String(b.v).replace(/\n/g, '<br>') + '</div>';
  });
  if (a.go && a.go.length) h += '<div class="mgo">' + a.go.map(function(n){
    return '<span class="chip" data-n="' + n + '">' + HJ(gua(n).name) + '</span>'; }).join('') + '</div>';
  return h + '</div>';
}
function renderAI(){
  const b = document.getElementById('aibody');
  if (!b) return;
  b.innerHTML = aiHist.map(msgHTML).join('');
  b.querySelectorAll('.mgo .chip[data-n]').forEach(function(c){
    c.onclick = function(){ cur = +c.dataset.n; resetMv(); renderAll(); window.scrollTo({top:0, behavior:'smooth'}); };
  });
  b.scrollTop = b.scrollHeight;
}
/* ---------------- 后台：问题反馈记录 ---------------- */
function renderBugUI(){
  const n = document.getElementById('bugn'), l = document.getElementById('buglist');
  if (!n || !l) return;
  const arr = bugLogs();
  n.textContent = arr.length;
  l.innerHTML = arr.length
    ? arr.slice().reverse().slice(0, 20).map(function(r){
        return '<div class="bugitem"><span class="bi">#' + r.id + '</span>'
          + '<span class="bf">' + (r.feats && r.feats.length
              ? r.feats.map(function(x){ return HJ(x); }).join('、') : HM('未定位功能')) + '</span>'
          + '<span class="bq">' + esc(String(r.q)).slice(0, 160) + '</span>'
          + '<span class="bt">' + esc(String(r.t)).slice(0, 19).replace('T', ' ')
          + (r.gua ? HM(' · 第') + r.gua + HM('卦') : '') + '</span></div>';
      }).join('')
    : '<div class="ahint">' + HM('还没有记录。') + '</div>';
}
function bugExport(){
  try {
    const blob = new Blob([JSON.stringify(bugLogs(), null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '读易-反馈记录.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast(HM('已导出记录'));
  } catch(e){ toast(HM('导出失败')); }
}
function aiPush(x){ aiHist.push(x); renderAI(); }
function aiWelcome(){
  aiPush({role:'a', a:{title:HM('可以问我这些'), go:[], blocks:[
    {k:'p', v:HM('我读的是本站自己的数据：六十四卦的卦辞、大象传、爻辞与自研今译。不提供占卜与预测。')},
    {k:'list', v:QA_PRESET.map(function(t){ return HM(t); })}
  ]}});
}
function aiAsk(text){
  const q = String(text || '').trim();
  if (!q) return;
  aiPush({role:'q', text:q});
  /* 功能性 bug 反馈优先：先记后台，再回固定话术，不进问答引擎 */
  const bug = bugDetect(q);
  if (bug) {
    const no = logBug(q, bug.feats);
    aiPush({role:'a', a:bugReply(bug.feats, no)});
    return;
  }
  const pend = {role:'a', a:{title:HM('正在查'), go:[], blocks:[{k:'p', v:HM('…')}]}};
  aiPush(pend);
  ask(q, function(a){
    aiHist = aiHist.filter(function(x){ return x !== pend; });
    aiPush({role:'a', a:a || {title:HM('没有答案'), go:[], blocks:[{k:'p', v:HM('换个说法试试。')}]}});
  });
}
function initAI(){
  try {
    const send = function(){
      const i = document.getElementById('aiq');
      aiAsk(i.value); i.value = '';
    };
    document.getElementById('aisend').onclick = send;
    document.getElementById('aiq').onkeydown = function(e){ if (e.key === 'Enter') send(); };
    const ps = document.getElementById('aipreset');
    ps.innerHTML = QA_PRESET.map(function(t){ return '<span class="pchip">' + HM(t) + '</span>'; }).join('');
    ps.querySelectorAll('.pchip').forEach(function(c){
      c.onclick = function(){ const i = document.getElementById('aiq'); i.value = c.textContent; send(); };
    });
    document.getElementById('aiclear').onclick = function(){ aiHist = []; aiWelcome(); };
    document.getElementById('aiSave').onclick = function(){
      aiSaveCfg(
        document.getElementById('aiEp').value.trim(),
        document.getElementById('aiKey').value.trim(),
        document.getElementById('aiModel').value.trim()
      );
    };
    document.getElementById('aiReset').onclick = function(){ aiSaveCfg('', '', ''); };
    aiCfgUI();

    /* 后台：问题反馈记录面板 */
    document.getElementById('bugSave').onclick = function(){
      const ep = document.getElementById('bugEp').value.trim();
      try { localStorage.setItem('zy.bugep', JSON.stringify({ep:ep})); } catch(e){}
      toast(HM(ep ? '上报地址已保存' : '已取消上报'));
      renderBugUI();
    };
    document.getElementById('bugExport').onclick = bugExport;
    document.getElementById('bugClear').onclick = function(){
      try { localStorage.removeItem('zy.buglog'); } catch(e){}
      renderBugUI(); toast(HM('反馈记录已清空'));
    };
    const bc = bugCfg();
    if (bc && bc.ep) document.getElementById('bugEp').value = bc.ep;
    renderBugUI();

    /* 目录 / 助手：默认都展开，状态存本地 */
    let sideOn = true, aiOn = true;
    try {
      if (localStorage.getItem('zy.sideon') === '0') sideOn = false;
      if (localStorage.getItem('zy.aion')   === '0') aiOn   = false;
    } catch(e){}
    document.getElementById('sideTog').onclick = function(){ sideToggle(); };
    document.getElementById('sideRail').onclick = function(){ sideCollapse(false); };
    document.getElementById('aiTog').onclick   = function(){ aiToggle(); };
    document.body.classList.toggle('sideoff', !sideOn);
    document.body.classList.toggle('sidecollapse', localStorage.getItem('zy.sidecol') === '1');
    document.body.classList.toggle('aioff', !aiOn);
    syncTog();

    renderAI();
    if (aiOn) aiWelcome();
  } catch(e){}
}

applyTheme();
buildGloss();
applyScriptUI();
renderAll();
initAI();
</script>
